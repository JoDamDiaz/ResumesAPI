services:
  mysql:
    image: mysql:8.0
    container_name: resumes_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: resumes_db
      MYSQL_USER: resumes_user
      MYSQL_PASSWORD: resumes_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "resumes_user", "-presumes_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: resumes_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
